<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadre Stratégique — ECE Fabriquerie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #feca57, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #feca57;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #feca57;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .submit-btn {
            background: linear-gradient(90deg, #feca57, #ff6b6b);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: block;
            margin: 40px auto 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(254, 202, 87, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(254, 202, 87, 0.2);
            border: 1px solid #feca57;
            color: #feca57;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .nav {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav a {
            color: #888;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav a:hover,
        .nav a.active {
            color: #feca57;
            background: rgba(254, 202, 87, 0.1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .container { padding: 0 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html">Accueil</a>
            <a href="competences.html">Compétences</a>
            <a href="strategie.html" class="active">Stratégie</a>
            <a href="positionnement.html">Positionnement</a>
        </nav>

        <h1>Cadre Stratégique</h1>
        <p class="subtitle">Réunion ECE — Fabriquerie | Vision, valeurs, objectifs</p>

        <form id="form-strategie">
            <div class="form-group">
                <label for="nom">Nom du participant *</label>
                <input type="text" id="nom" name="nom_participant" required placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label for="vision">Vision du projet ECE / Fabriquerie</label>
                <textarea id="vision" name="vision" placeholder="Où voyez-vous ce projet dans 3-5 ans ?"></textarea>
            </div>

            <div class="form-group">
                <label for="valeurs">Valeurs partagées</label>
                <textarea id="valeurs" name="valeurs" placeholder="Quelles valeurs doivent guider ce projet ?"></textarea>
            </div>

            <div class="form-group">
                <label for="objectifs">Objectifs concrets</label>
                <textarea id="objectifs" name="objectifs" placeholder="Objectifs SMART pour les 12 prochains mois..."></textarea>
            </div>

            <div class="form-group">
                <label for="valeur-creee">Proposition de valeur</label>
                <textarea id="valeur-creee" name="valeur_creee" placeholder="Quelle valeur créons-nous pour nos bénéficiaires ?"></textarea>
            </div>

            <div class="form-group">
                <label for="modele">Modèle économique</label>
                <textarea id="modele" name="modele_economique" placeholder="Comment se finance ce projet ?"></textarea>
            </div>

            <div class="form-group">
                <label for="projets">Projets prioritaires</label>
                <textarea id="projets" name="projets_prioritaires" placeholder="Projets à court/moyen terme..."></textarea>
            </div>

            <div class="form-group">
                <label for="organisation">Organisation — Rôles et décisions</label>
                <textarea id="organisation" name="organisation" placeholder="Comment prend-on les décisions ? Qui fait quoi ?"></textarea>
            </div>

            <div class="form-group">
                <label for="juridique">Aspects juridiques</label>
                <textarea id="juridique" name="juridique" placeholder="Contrats, assurances, statuts..."></textarea>
                <p class="hint">Si applicable</p>
            </div>

            <button type="submit" class="submit-btn">Envoyer</button>
            <div id="message" class="message"></div>
        </form>
    </div>

    <script src="assets/nocodb-client.js"></script>
    <script>
        document.getElementById('form-strategie').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('.submit-btn');
            const messageDiv = document.getElementById('message');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours...';
            messageDiv.style.display = 'none';
            
            try {
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData);
                
                Object.keys(data).forEach(key => {
                    if (data[key] === '') delete data[key];
                });
                
                await nocoClient.create('strategie', data);
                
                messageDiv.className = 'message success';
                messageDiv.textContent = '✓ Enregistré avec succès !';
                messageDiv.style.display = 'block';
                
                e.target.reset();
                
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '✗ Erreur : ' + error.message;
                messageDiv.style.display = 'block';
                console.error('Erreur NocoDB:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Envoyer';
            }
        });
    </script>
</body>
</html>
