<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétences — ECE Fabriquerie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .submit-btn {
            background: linear-gradient(90deg, #667eea, #764ba2);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: block;
            margin: 40px auto 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .nav {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav a {
            color: #888;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav a:hover,
        .nav a.active {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .container { padding: 0 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html">Accueil</a>
            <a href="competences.html" class="active">Compétences</a>
            <a href="strategie.html">Stratégie</a>
            <a href="positionnement.html">Positionnement</a>
        </nav>

        <h1>Tableau des Compétences</h1>
        <p class="subtitle">Réunion ECE — Fabriquerie | Vue par soi vs. Vue par les autres</p>

        <form id="form-competences">
            <div class="form-group">
                <label for="nom">Nom du participant *</label>
                <input type="text" id="nom" name="nom_participant" required placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label for="role">Rôle</label>
                <input type="text" id="role" name="role" placeholder="Ex: Présidente, Salarié, Bénévole...">
            </div>

            <div class="form-group">
                <label for="par-soi">Compétences vues par soi</label>
                <textarea id="par-soi" name="competences_vues_par_soi" placeholder="Ce que vous pensez de vos compétences..."></textarea>
                <p class="hint">Décrivez vos forces selon votre propre perception</p>
            </div>

            <div class="form-group">
                <label for="par-autres">Compétences vues par les autres</label>
                <textarea id="par-autres" name="competences_vues_par_autres" placeholder="Ce que les autres perçoivent..."></textarea>
                <p class="hint">Ce que le groupe reconnaît comme vos compétences</p>
            </div>

            <div class="form-group">
                <label for="forces">Forces principales</label>
                <textarea id="forces" name="forces_principales" placeholder="Vos 3 forces principales..."></textarea>
                <p class="hint">Listez vos 3 forces clés</p>
            </div>

            <div class="form-group">
                <label for="amelioration">Zones d'amélioration</label>
                <textarea id="amelioration" name="zones_amelioration" placeholder="Ce que vous voulez améliorer..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Envoyer</button>
            <div id="message" class="message"></div>
        </form>
    </div>

    <script src="assets/nocodb-client.js"></script>
    <script>
        document.getElementById('form-competences').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('.submit-btn');
            const messageDiv = document.getElementById('message');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours...';
            messageDiv.style.display = 'none';
            
            try {
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData);
                
                // Nettoyer les données vides
                Object.keys(data).forEach(key => {
                    if (data[key] === '') delete data[key];
                });
                
                await nocoClient.create('competences', data);
                
                messageDiv.className = 'message success';
                messageDiv.textContent = '✓ Enregistré avec succès !';
                messageDiv.style.display = 'block';
                
                e.target.reset();
                
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '✗ Erreur : ' + error.message;
                messageDiv.style.display = 'block';
                console.error('Erreur NocoDB:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Envoyer';
            }
        });
    </script>
</body>
</html>
